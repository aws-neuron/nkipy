[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nkipy-serving"
version = "0.1.0"
description = "Python-first Neuron serving runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129.0",
    "huggingface-hub>=1.4.1",
    "jinja2>=3.1.0",
    "msgspec>=0.19.0",
    "neuronx-cc==2.26.6360.0",
    "nki==0.5.0",
    "nkipy",
    "numpy>=1.26",
    "orjson>=3.11.7",
    "pydantic>=2,<3",
    "pytest>=9.0.2",
    "pytest-xdist>=3.6.1",
    "pyzmq>=26.0",
    "safetensors>=0.7.0",
    "spike",
    "tokenizers>=0.22.1",
    "transformers>=5.0.0",
    "uvicorn>=0.41.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
test = ["ruff==0.14.10"]

[project.scripts]
nkipy-serving = "nkipy_serving.launch_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
nkipy = { workspace = true }
spike = { workspace = true }
neuronx-cc = { index = "neuron" }
nki = { index = "neuron" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# Keep the default `pytest` run fast by only collecting unit tests in `tests/`.
# Slow integration tests are marked `@pytest.mark.integration` and are skipped
# unless `--run-integration` is provided (see tests/conftest.py).
testpaths = ["tests"]
markers = [
    "integration: integration tests (slow; may require local HuggingFace snapshots).",
    "device_gpt_oss: GPT-OSS device tests (very slow; requires Neuron cores and local HF cache).",
]
